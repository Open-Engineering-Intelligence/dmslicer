name: Evidence promotion MVP

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-python-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install P2 MVP
        run: python -m pip install -e .
      - name: Run pure-Python evidence tests
        run: python -m pytest -q
      - name: Protect frozen research contract
        shell: bash
        run: |
          git fetch --no-tags origin main
          git diff --exit-code origin/main -- docs/research_v2
