<script id="viewer-code">
"use strict";
(() => {
  const model = JSON.parse(document.getElementById("viewer-model").textContent);
  const valid = model.validation.snapshot.status === "VALID";
  const groups = [
    ["regions","Regions","region_id"], ["relations","Relations","relation_id"],
    ["interfaces","Interfaces","interface_id"], ["interface_components","Components","component_id"],
    ["patches","Patches","patch_id"], ["boundaries","Boundaries","boundary_id"],
    ["surface_partitions","Surface Partitions","partition_id"], ["semantic_bindings","Semantic Bindings","binding_id"]
  ];
  const referenceKeys = new Set(["region_refs","relation_ref","interface_ref","component_ref","patch_refs","patch_ref","source_face_refs","subject_ref","artifact_ref","provenance_ref","frame_ref","source_document_id","tolerance_refs","parent_snapshot_ids","selected_interface_id","selected_patch_ids","target_region_id","local_frame_ref","expected_partition_refs","provenance_reference","input_snapshot_id"]);
  const entities = new Map(), backlinks = new Map(), selected = new Map();
  const get = id => document.getElementById(id);
  function el(tag, text, cls) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = String(text);
    if (cls) node.className = cls;
    return node;
  }
  function badge(value) {
    const cls = ["VALID","CONFIRMED","ENABLED","ACTIVE"].includes(value) ? "ok" :
      ["INVALID","UNAVAILABLE","FAILED"].includes(value) ? "error" :
      ["AMBIGUOUS","REJECTED","UNSUPPORTED","DISABLED"].includes(value) ? "warning" : "";
    return el("span",value,"badge " + cls);
  }
  function register(records, idKey, title) {
    for (const record of records || []) entities.set(record[idKey],{record,title,id:record[idKey]});
  }
  if (valid) {
    for (const [key,title,idKey] of groups) register(model[key],idKey,title);
    register(model.metadata.source_documents,"source_document_id","Source Document");
    register(model.metadata.tolerances,"tolerance_id","Tolerance");
    register(model.artifact_links,"artifact_id","Artifact");
    register(model.provenance_links,"provenance_id","Provenance");
    if (model.metadata.model_frame) register([model.metadata.model_frame],"frame_id","Model Frame");
  }
  const overlay = model.decision_overlay;
  if (valid && overlay.state === "ENABLED" && overlay.selection) {
    const mark = (id,text) => {if (entities.has(id)) selected.set(id,text);};
    mark(overlay.selection.selected_interface_id,"Selected interface");
    for (const id of overlay.selection.selected_patch_ids) mark(id,"Selected patch");
    mark(overlay.selection.target_region_id,"Target region");
  }
  function link(id) {
    if (!entities.has(id)) return el("code",id);
    const span = el("span");
    const a = el("a",id,"entity-link");
    a.href = "#entity/" + encodeURIComponent(id);
    a.dataset.entityId = id;
    span.append(a);
    if (selected.has(id)) span.append(el("span",selected.get(id),"selection-mark"));
    return span;
  }
  function valueNode(value,key) {
    if (Array.isArray(value)) {
      if (!value.length) return el("code","[]");
      if (value.every(v => typeof v === "number")) return el("code",JSON.stringify(value));
      const list = el("ul",undefined,"values");
      for (const item of value) {const li=el("li"); li.append(valueNode(item,key)); list.append(li);}
      return list;
    }
    if (value !== null && typeof value === "object") return fields(value);
    if (typeof value === "string" && referenceKeys.has(key)) return link(value);
    return el("code",value === null ? "null" : value);
  }
  function fields(record) {
    const table = el("table",undefined,"fields"), body=el("tbody");
    for (const [key,value] of Object.entries(record)) {
      const row=el("tr"), heading=el("th",key), cell=el("td");
      heading.scope="row"; cell.append(valueNode(value,key)); row.append(heading,cell); body.append(row);
    }
    table.append(body); return table;
  }
  function sourceSummary(ref) {
    const box=el("div"); box.append(link(ref.artifact_ref));
    box.append(el("div",ref.locator.scheme + ": " + ref.locator.value,"mono"));
    if(ref.locator.provenance_ref) box.append(link(ref.locator.provenance_ref));
    return box;
  }
  function scanReferences(value,key,source) {
    if (Array.isArray(value)) {for (const item of value) scanReferences(item,key,source);}
    else if (value !== null && typeof value === "object") {for (const [k,v] of Object.entries(value)) scanReferences(v,k,source);}
    else if (referenceKeys.has(key) && entities.has(value) && value !== source) {
      if (!backlinks.has(value)) backlinks.set(value,new Set());
      backlinks.get(value).add(source);
    }
  }
  for (const entity of entities.values()) scanReferences(entity.record,"",entity.id);
  function panel(parent,title) {
    const section=el("section",undefined,"panel"); section.append(el("h2",title)); parent.append(section); return section;
  }
  function table(parent,headers,rows,id) {
    const wrap=el("div",undefined,"table-wrap"), t=el("table"), head=el("thead"), hr=el("tr"), body=el("tbody");
    if(id) t.id=id;
    for(const title of headers) {const th=el("th",title); th.scope="col"; hr.append(th);}
    head.append(hr);
    for(const cells of rows) {const row=el("tr"); for(const content of cells) {const cell=el("td"); cell.append(content instanceof Node ? content : document.createTextNode(String(content))); row.append(cell);} body.append(row);}
    t.append(head,body); wrap.append(t); parent.append(wrap); return t;
  }
  const hs=get("header-status");
  hs.append(el("span","Snapshot"),badge(model.validation.snapshot.status));
  hs.append(el("span","Decision"),badge(overlay.status || model.validation.decision.status));
  hs.append(el("span","Decision schema"),badge(model.validation.decision.status));
  hs.append(el("span","Overlay"),badge(overlay.state));
  const hm=get("header-metadata"), metadata=model.metadata;
  if(metadata.contract) hm.append(el("p",metadata.contract.name + " / " + metadata.contract.version));
  if(metadata.snapshot_id) hm.append(el("p",metadata.snapshot_id,"mono"));
  if(metadata.label) hm.append(el("p",metadata.label));
  const vp=get("validation-panel"); vp.append(el("h2","Validation diagnostics"));
  vp.append(el("p","Contract validation only. CAD geometry and slicing execution are not evaluated.","muted"));
  const validationStates=el("div",undefined,"status-line"); vp.append(validationStates);
  for(const [name,result] of Object.entries(model.validation)) {
    const line=el("span"); line.append(el("strong",name + ": "),badge(result.status)); validationStates.append(line);
    for(const issue of result.issues) {const box=el("div",undefined,"diagnostic"); box.append(el("strong",issue.code),el("p",issue.path,"mono"),el("p",issue.message)); vp.append(box);}
  }
  const dp=get("decision-panel"); dp.append(el("h2","SlicerDecision overlay"));
  for(const field of ["state","status","reason_code","disabled_reason"]) if(field in overlay) {const line=el("p"); line.append(el("strong",field + ": "),badge(overlay[field])); dp.append(line);}
  if(overlay.decision_id) dp.append(el("p",overlay.decision_id,"mono"));
  if(valid && overlay.state === "ENABLED" && overlay.selection) {
    dp.append(el("p","Expected / NOT_EXECUTED — expected partition references are decision expectations, not evidence of slicing.","muted"));
    dp.append(fields(overlay.selection));
    if(overlay.provenance_reference) {const line=el("p","provenance_reference: "); line.append(link(overlay.provenance_reference)); dp.append(line);}
  }
  const navigation=get("entity-navigation"), overview=get("overview");
  if(!valid) {
    navigation.append(el("p","Authoritative entity navigation unavailable.","empty"));
    overview.append(el("p","Snapshot validation did not succeed. Only diagnostics are shown.","empty"));
  } else {
    const summary=panel(overview,"Contract overview");
    summary.append(el("p","Membership and references below are declared contract topology. Layout does not represent CAD position.","muted"));
    const counts=el("div",undefined,"counts"); summary.append(counts);
    for(const [key,title,idKey] of groups) {
      const records=model[key] || [], state=model.collection_presence[key];
      const section=el("section");
      section.append(el("h3",state === "ABSENT" ? title + " — ABSENT" : title + " (" + records.length + ")"));
      if(state === "ABSENT") section.append(el("p","Not supplied by the contract.","empty"));
      else if(!records.length) section.append(el("p","EMPTY — explicitly supplied.","empty"));
      const list=el("ul");
      for(const record of records) {const li=el("li"); li.append(link(record[idKey])); if(record.role) li.append(el("div",record.role,"muted")); list.append(li);}
      section.append(list); navigation.append(section);
      counts.append(el("span",title + ": " + (state === "ABSENT" ? "ABSENT" : records.length)));
    }
    const partitions=panel(overview,"Surface partitions — declared coverage");
    if(model.collection_presence.surface_partitions === "ABSENT") partitions.append(el("p","Surface Partitions — ABSENT. No partitions have been generated by this viewer.","empty"));
    else table(partitions,["Role","Area","Partition ID","Source locator"],model.surface_partitions.map(p=>[badge(p.role),p.area ? p.area.value + " " + p.area.unit : "Not supplied",link(p.partition_id),sourceSummary(p.source_geometry_ref)]),"partition-summary");
    const relations=panel(overview,"Relations");
    table(relations,["Relation / regions","Taxonomy","Confirmation","Reading"],model.relations.map(r=>{
      const refs=el("div"); refs.append(link(r.relation_id),valueNode(r.region_refs,"region_refs"));
      return [refs,badge(r.taxonomy),badge(r.confirmation),r.taxonomy === "DISJOINT" && r.confirmation === "CONFIRMED" ? "Confirmed to be disjoint" : "Taxonomy and confirmation are separate contract facts"];
    }));
    const interfaces=panel(overview,"Interfaces — declared membership");
    if(!model.interfaces.length) interfaces.append(el("p","No interfaces supplied.","empty"));
    for(const item of model.interfaces) {
      const box=el("div",undefined,"membership"); box.append(link(item.interface_id));
      const regions=el("p","Regions: "); regions.append(valueNode(item.region_refs,"region_refs")); box.append(regions);
      for(const component of model.interface_components.filter(c=>c.interface_ref === item.interface_id)) {
        const block=el("div",undefined,"membership"); block.append(el("strong","Component: "),link(component.component_id));
        const patches=el("p","Patches: "); patches.append(valueNode(component.patch_refs,"patch_refs")); block.append(patches); box.append(block);
      }
      interfaces.append(box);
    }
    const bindings=panel(overview,"Semantic bindings — supplied activation");
    if(!model.semantic_bindings.length) bindings.append(el("p","Semantic bindings not supplied.","empty"));
    else table(bindings,["Binding","Subject","Role","Activation"],model.semantic_bindings.map(b=>[link(b.binding_id),link(b.subject_ref),b.semantic_role,badge(b.activation)]));
    const artifacts=panel(overview,"Artifact / provenance references");
    artifacts.append(el("p","URIs are plain text. Resolution is the saved model observation; current existence has not been rechecked by this page.","muted"));
    table(artifacts,["Artifact","Kind","URI","Saved resolution"],model.artifact_links.map(a=>[link(a.artifact_id),a.kind,el("code",a.uri),a.resolution]));
    for(const p of model.provenance_links) {const box=el("div",undefined,"membership"); box.append(link(p.provenance_id),fields(p)); artifacts.append(box);}
    const meta=panel(overview,"Contract metadata"); meta.append(fields(metadata));
  }
  function navigate() {
    let id;
    try {if(location.hash.startsWith("#entity/")) id=decodeURIComponent(location.hash.slice(8));} catch (_) {id=undefined;}
    const entity=valid ? entities.get(id) : undefined, detail=get("entity-detail");
    for(const a of navigation.querySelectorAll("a[data-entity-id]")) {
      if(a.dataset.entityId === id && entity) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
    }
    overview.hidden=!!entity; detail.hidden=!entity; dp.hidden=!!entity;
    if(entity) {
      detail.replaceChildren(); detail.append(el("h2",entity.title + " — entity detail"),el("p",entity.id,"mono"));
      if(selected.has(id)) detail.append(el("span",selected.get(id),"selection-mark"));
      detail.append(fields(entity.record));
      const reverse=el("section",undefined,"backreferences"); reverse.append(el("h3","Referenced by — declared references"));
      const refs=Array.from(backlinks.get(id) || []).sort();
      if(!refs.length) reverse.append(el("p","No incoming references supplied.","empty"));
      for(const source of refs) {const p=el("p"); p.append(link(source)); reverse.append(p);}
      detail.append(reverse); detail.dataset.entityId=id; detail.focus({preventScroll:true});
    }
    get("main-content").scrollTop=0;
  }
  window.addEventListener("hashchange",navigate);
  navigate();
  document.documentElement.dataset.ready="true";
})();
</script>
</body>
</html>
