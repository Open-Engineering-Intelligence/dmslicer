<!doctype html><meta charset=utf-8><title>材料与语义子界面预览</title><style>body{font:14px system-ui;margin:auto;max-width:1200px;padding:20px;background:#f4f7f8}header,section,dialog{background:white;padding:16px;border:1px solid #ccd7dc;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #dde5e8;text-align:left}.swatch{width:24px;height:24px;border:1px solid #555;border-radius:4px}button{margin:4px;padding:7px 10px}dialog{min-width:360px}.hidden{display:none}</style><header><h1>材料与语义子界面预览</h1><p>56811 开发预览：没有画布、相机、可见性或几何控制。56810 保持冻结。</p><label>案例 <select id=samples><option value="">选择示例…</option></select></label><span id=status>等待案例。</span></header><section><button id=edit disabled>编辑材料与语义</button><button id=reset disabled>重置所选</button><button id=add>添加材料</button><table><thead><tr><th></th><th>对象</th><th>稳定引用</th><th>语义</th><th>材料/显示色</th></tr></thead><tbody id=objects></tbody></table></section><dialog id=assignment aria-label="编辑材料与语义"><form method=dialog><h2>编辑材料与语义</h2><p id=count></p><label>类型 <select id=assignment-type><option>Unassigned</option><option>Source</option><option>Gradient</option><option>Isolator</option></select></label><label>材料 <select id=assignment-material></select></label><label id=group-wrap>贯通组 <input id=assignment-group value=G></label><label>显示覆盖 <input id=assignment-color type=color value=#8ca3b3></label><p id=assignment-error></p><button value=cancel>取消</button><button id=assignment-add type=button>添加材料</button><button id=apply value=apply>Apply</button></form></dialog><dialog id=material aria-label="材料属性"><form method=dialog><h2>材料属性</h2><label>ID <input id=material-id required></label><label>名称 <input id=material-name required></label><label>颜色 <input id=material-color type=color value=#498b92></label><label>说明 <textarea id=material-description></textarea></label><label>属性 JSON <textarea id=material-properties>{}</textarea></label><p id=material-error></p><button value=cancel>取消</button><button id=save-material value=save>保存材料</button></form></dialog><dialog id=confirm><p>只清除所选对象的 annotation 草稿；案例和几何状态不变。</p><button value=cancel>取消</button><button id=confirm-reset value=ok>确认重置</button></dialog><script>__ANNOTATIONS__</script><script>let c,w,sel=[],draft,returnAssignment=false;const $=id=>document.getElementById(id);function render(){let b=$('objects');b.replaceChildren();for(const e of c?.scene.entities||[]){let o=w.objects.find(x=>x.entity_ref===e.entity_ref),tr=document.createElement('tr');tr.innerHTML='<td><input class=object-select type=checkbox '+(!o?'disabled':'')+'></td><td>'+e.display_name+'</td><td>'+e.entity_ref+'</td><td>'+(o?.semantic_type||'只读')+'</td><td></td>';let sw=document.createElement('button');sw.className='swatch';sw.style.background=WorkspaceAnnotations.color(w,e.entity_ref);sw.onclick=()=>{if(o){sel=[e.entity_ref];openAssign()}};tr.lastChild.append(sw);tr.querySelector('input').onchange=()=>{sel=[...document.querySelectorAll('.object-select:checked')].map((_,i)=>[...document.querySelectorAll('.object-select:checked')][i].closest('tr').dataset.ref);$('edit').disabled=!sel.length;$('reset').disabled=!sel.length};tr.dataset.ref=e.entity_ref;b.append(tr)}}function openAssign(){draft={semantic_type:'Unassigned',material_id:null,gradient_group_id:'G',display_override:null};$('count').textContent=sel.length+' 个已选对象';fillMaterials();toggle();$('assignment').showModal()}function fillMaterials(){let s=$('assignment-material');s.replaceChildren(new Option('未分配',''));for(const m of w.material_library.materials)s.append(new Option(m.name,m.id))}function toggle(){let g=$('assignment-type').value;$('assignment-material').disabled=g==='Gradient';$('group-wrap').classList.toggle('hidden',g!=='Gradient')}function openMaterial(){returnAssignment=$('assignment').open;$('assignment').close();$('material').showModal()}$('assignment-type').onchange=toggle;$('edit').onclick=openAssign;$('add').onclick=openMaterial;$('assignment-add').onclick=openMaterial;$('save-material').onclick=e=>{e.preventDefault();try{WorkspaceAnnotations.putMaterial(w,{id:$('material-id').value,name:$('material-name').value,category:'自定义',color:$('material-color').value,description:$('material-description').value,properties:JSON.parse($('material-properties').value)});$('material').close();render();if(returnAssignment){fillMaterials();$('assignment').showModal()}}catch(x){$('material-error').textContent=x.message}};$('apply').onclick=e=>{e.preventDefault();try{WorkspaceAnnotations.applyAssignment(w,sel,{semantic_type:$('assignment-type').value,material_id:$('assignment-material').value||null,gradient_group_id:$('assignment-group').value,display_override:$('assignment-color').value});$('assignment').close();render();$('status').textContent='Apply 已原子更新 annotation 草稿；尚未 Save。'}catch(x){$('assignment-error').textContent=x.message}};$('reset').onclick=()=>$('confirm').showModal();$('confirm-reset').onclick=()=>{for(const r of sel)WorkspaceAnnotations.applyAssignment(w,[r],{semantic_type:'Unassigned',display_override:null});$('confirm').close();render();$('status').textContent='已清除所选分配；尚未 Save。'};async function load(){let r=await fetch('/samples');for(const x of await r.json())$('samples').append(new Option(x.label,x.key));document.documentElement.dataset.ready='true'}$('samples').onchange=async()=>{let r=await fetch('/sample/'+$('samples').value),v=await fetch('/package',{method:'POST',body:await r.blob()}).then(x=>x.json());c=v.cases[0];w=WorkspaceAnnotations.create(c);render();$('status').textContent='已加载 '+c.case_id};load()</script>
